<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 190" width="880" height="190" role="img" aria-label="Rannah: Arabic-first reminders for Android">
  <title>Rannah: Arabic-first reminders for Android</title>
  <desc>Rannah: Arabic-first reminders for Android</desc>
  <defs>
    <clipPath id="typeRL">
      <!-- Base width is the full line, so the text stays readable wherever
           SMIL does not run. The animation overrides it when it does. -->
      <rect x="120" y="116" width="441" height="26">
        <animate attributeName="width" values="0;0;441;441;0" keyTimes="0;0.06;0.55;0.92;1" dur="11s" repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="878" height="188" rx="16" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5" />

  <g transform="translate(40, 62)">
    <path d="M20 30c0-5.5 4.5-10 10-10s10 4.5 10 10c0 9 3.5 12.5 5.5 15.5 1 1.5 0 3.5-1.8 3.5H16.3c-1.8 0-2.8-2-1.8-3.5C16.5 42.5 20 39 20 30Z" fill="#0B6B5F"/><circle cx="30" cy="18" r="3.2" fill="#0B6B5F"/><path d="M25.5 52.5h9a4.5 4.5 0 0 1-9 0Z" fill="#0B6B5F"/>
  </g>

  <rect x="100" y="46" width="3" height="98" rx="1.5" fill="#0B6B5F" opacity="0.35" />

  <text x="120" y="80" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#1f2328">Rannah</text>

  <text x="120" y="106" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="500" fill="#57606a">Arabic-first reminders for Android</text>

  <g clip-path="url(#typeRL)">
    <text x="120" y="136" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, monospace" font-size="14" fill="#0B6B5F">one-time, daily, recurring. offline by construction.</text>
  </g>

  <rect x="561" y="120" width="2" height="18" fill="#0B6B5F" opacity="0">
    <animate attributeName="x" values="120;120;561;561;120" keyTimes="0;0.06;0.55;0.92;1" dur="11s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;1;0;1" keyTimes="0;0.45;0.5;1" dur="1s" repeatCount="indefinite" />
  </rect>
</svg>
