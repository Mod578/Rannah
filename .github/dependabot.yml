version: 2
updates:
  # The Gradle build, including the version catalog in gradle/libs.versions.toml.
  - package-ecosystem: gradle
    directory: /Rannah
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
